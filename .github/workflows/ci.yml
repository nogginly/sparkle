name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - uses: actions/cache@v6
        with:
          path: .tools/ponyc
          key: ponyc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/ponyc/VERSION') }}

      - name: Install ponyc
        run: make ponyc

      - name: Install lld
        if: runner.os == 'Linux'
        run: command -v ld.lld || { sudo apt-get update && sudo apt-get install -y lld; }

      - name: Read the Crystal version
        id: crystal
        run: echo "version=$(crystal env CRYSTAL_VERSION)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: |
            lib
            bin/ameba
            bin/ameba.cr
          key: ameba-${{ runner.os }}-${{ runner.arch }}-crystal-${{ steps.crystal.outputs.version }}-${{ hashFiles('shard.lock') }}

      - name: Build ameba
        run: make ameba

      - name: Build
        run: make build

      - name: Test, with no pending specs
        run: |
          set -o pipefail
          make test 2>&1 | tee spec.log
          grep -q ', 0 pending' spec.log || { echo "::error::pending specs: ponyc was not used"; exit 1; }

      - name: Lint
        run: make lint

      - name: Format
        run: crystal tool format --check src spec
