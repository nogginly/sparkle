name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - uses: actions/cache@v4
        with:
          path: .tools/ponyc
          key: ponyc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/ponyc/VERSION') }}

      - name: Install ponyc
        run: make ponyc

      - name: Build ameba
        run: make ameba

      - name: Build
        run: make build

      - name: Test, with no pending specs
        run: |
          make test 2>&1 | tee spec.log
          grep -q ', 0 pending' spec.log || { echo "::error::pending specs: ponyc was not used"; exit 1; }

      - name: Lint
        run: make lint

      - name: Format
        run: crystal tool format --check src spec
